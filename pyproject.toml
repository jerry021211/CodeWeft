[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "A minimal, extensible coding-agent harness."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27,<1",
    "langsmith>=0.1.95",
    "mcp>=2,<3",
    "python-dotenv>=1.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
codeagent = "codeagent.cli:main"
codeagent-web = "codeagent.web.cli:main"

[tool.setuptools.packages.find]
include = ["codeagent*"]
